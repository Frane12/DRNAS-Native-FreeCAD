plugins {
  id 'com.android.application'
}
android {
  namespace 'org.drnas.freecad.smoke'
  compileSdk 35
  defaultConfig {
    applicationId 'org.drnas.freecad.coreprobe'
    minSdk 26
    targetSdk 35
    versionCode 3
    versionName '0.0.3-native-render-lab'
    ndk { abiFilters 'arm64-v8a' }
  }
  buildTypes { release { minifyEnabled false } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  packaging {
    jniLibs { useLegacyPackaging true }
  }
}
