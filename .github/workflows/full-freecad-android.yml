name: DRNAS FreeCAD Full Core Android ARM64

on:
  push:
    branches: [feature/full-freecad-android]
    paths:
      - '.github/workflows/full-freecad-android.yml'
      - 'full-port/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '26'
  FREECAD_REF: 'd4ffc7f725973e073907746e88d320d3e438fd34'
  CCACHE_DIR: ${{ github.workspace }}/.cache/full-freecad
  CCACHE_MAXSIZE: '2G'
  CCACHE_COMPRESS: 'true'

concurrency:
  group: drnas-full-freecad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qt-android:
    name: Bootstrap official Qt6 Android ARM64 SDK + host tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt downloader and NDK tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv p7zip-full cmake ninja-build binutils file
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          mkdir -p out/full-freecad out/full-deps/qt
      - name: Restore previously verified Qt6 Android SDK (no redownload)
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt6-android-arm64-v6.8.3-host-linux-qtbase-v1-${{ hashFiles('full-port/verify-qt-android.sh', 'full-port/bootstrap-qt.sh') }}
      - name: Download official Android ARM64 Qt6 + Linux host Qt6
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-qt.sh
      - name: Verify Qt6 Android ELF and cross-link QtCore + QtXml
        id: verify
        run: bash full-port/verify-qt-android.sh
      - name: Save verified official Android Qt6 SDK
        if: steps.qtcache.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt6-android-arm64-v6.8.3-host-linux-qtbase-v1-${{ hashFiles('full-port/verify-qt-android.sh', 'full-port/bootstrap-qt.sh') }}
      - name: Upload Qt SDK validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-qt6-android-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-freecad/
          if-no-files-found: warn
          retention-days: 21

  yaml-android:
    name: Cross-compile verified yaml-cpp 0.8 for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install real Android build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build git binutils file ccache
          mkdir -p out/full-freecad
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
      - name: Restore cached Android yaml-cpp library
        id: yamlcache
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/yaml-cpp
          key: drnas-yaml-cpp-0.8.0-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-yaml-android.sh') }}
      - name: Cross-compile yaml-cpp for Android/Bionic
        if: steps.yamlcache.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-yaml-android.sh
      - name: Validate Android yaml-cpp package and ELF
        id: verify
        run: |
          set -euo pipefail
          test -d out/full-deps/yaml-cpp/lib/cmake/yaml-cpp
          lib="$(find out/full-deps/yaml-cpp/lib -maxdepth 1 -type f -name 'libyaml-cpp.so*' | head -1)"
          test -n "$lib"
          readelf -h "$lib" | grep -q 'Machine:.*AArch64'
          readelf -h "$lib" | grep -q 'Type:.*DYN'
          ! readelf -d "$lib" | grep -Eq 'libc\\.so\\.6|ld-linux'
          echo 'Validated true AArch64 Android yaml-cpp library'
      - name: Save yaml-cpp Android library after verified build
        if: steps.yamlcache.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/yaml-cpp
          key: drnas-yaml-cpp-0.8.0-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-yaml-android.sh') }}
      - name: Upload yaml-cpp build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-yaml-android-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-freecad/yaml*
          if-no-files-found: warn

  icu-android:
    name: Build ICU uc/i18n/data with Linux generators and Android ARM64 binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install ICU build tools and Android NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential python3 autoconf pkg-config binutils file
          mkdir -p out/full-freecad
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
      - name: Restore verified Android ICU 75.1 SDK
        id: icucache
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/icu
          key: drnas-icu75-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-icu-android.sh') }}
      - name: Build host data generators and Android ICU libraries
        if: steps.icucache.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-icu-android.sh
      - name: Verify Android ICU shared libraries
        id: verify
        run: |
          set -euo pipefail
          for name in icuuc icui18n icudata; do
            lib="$(find out/full-deps/icu/lib -maxdepth 1 -type f -name "lib${name}.so.*" -print -quit)"
            test -n "$lib"
            readelf -h "$lib" | grep -q 'Machine:.*AArch64'
            readelf -h "$lib" | grep -q 'Type:.*DYN'
            ! readelf -d "$lib" | grep -Eq 'libc\\.so\\.6|ld-linux'
          done
          echo 'PASS: ICU uc+i18n+data verified Android AArch64'
      - name: Cache real ICU binaries only after verification
        if: steps.icucache.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/icu
          key: drnas-icu75-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-icu-android.sh') }}
      - name: Upload ICU cross compile diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-icu-android-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-freecad/icu*
          if-no-files-found: warn

  python-android:
    name: Verify official CPython 3.14.8 Android embeddable SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK and verify toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file curl
          mkdir -p out/full-freecad
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
      - name: Restore verified official Android Python 3.14 SDK
        id: pycache
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/python
          key: drnas-python-3.14.8-official-android-arm64-v1-${{ hashFiles('full-port/bootstrap-python-android.sh') }}
      - name: Acquire and NDK-link official Python Android embeddable libraries
        if: steps.pycache.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-python-android.sh
      - name: Verify Android CPython SDK ELF on cached or new build
        id: verify
        run: |
          set -euo pipefail
          test -f out/full-deps/python/include/python3.14/Python.h
          lib="$(find out/full-deps/python/lib -maxdepth 2 -name 'libpython3.14.so*' -print -quit)"
          test -n "$lib"
          readelf -h "$lib" | grep -q 'Machine:.*AArch64'
          readelf -h "$lib" | grep -q 'Type:.*DYN'
          ! readelf -d "$lib" | grep -Eq 'libc\\.so\\.6|ld-linux'
      - name: Save verified Python Android SDK
        if: steps.pycache.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/python
          key: drnas-python-3.14.8-official-android-arm64-v1-${{ hashFiles('full-port/bootstrap-python-android.sh') }}
      - name: Upload Python SDK origin, checksum and ELF audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-python-android-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-freecad/python*
          if-no-files-found: warn

  xerces-android:
    name: Build real Xerces-C 3.2.5 for Android AArch64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: icu-android
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android Xerces build and NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build git ccache binutils file
          mkdir -p out/full-freecad
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
      - name: Restore verified ICU Android cache
        id: icu
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/icu
          key: drnas-icu75-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-icu-android.sh') }}
      - name: Demand Android ICU before compiling Xerces
        run: |
          test "${{ steps.icu.outputs.cache-hit }}" = true
          test -f out/full-deps/icu/lib/libicuuc.so
      - name: Restore already built Android Xerces-C
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/xerces-c
          key: drnas-xerces325-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-xerces-android.sh') }}
      - name: Cross-compile real Xerces-C for Android/Bionic
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-xerces-android.sh
      - name: Audit native Android AArch64 Xerces-C
        id: verify
        run: |
          set -euo pipefail
          test -f out/full-deps/xerces-c/include/xercesc/util/XercesVersion.hpp
          lib="$(find out/full-deps/xerces-c/lib -maxdepth 1 -type f -name 'libxerces-c*.so*' -print -quit)"
          test -n "$lib"
          readelf -h "$lib" | grep -q 'Machine:.*AArch64'
          readelf -h "$lib" | grep -q 'Type:.*DYN'
          ! readelf -d "$lib" | grep -Eq 'libc\\.so\\.6|ld-linux'
      - name: Save verified Xerces-C Android SDK
        if: steps.cache.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/xerces-c
          key: drnas-xerces325-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-xerces-android.sh') }}
      - name: Save build logs, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-xerces-android-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-freecad/xerces*
          if-no-files-found: warn

  freecad-full:
    name: Configure and compile REAL upstream FreeCADBase + FreeCADApp
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: [qt-android, yaml-android, icu-android, python-android, xerces-android]
    steps:
      - uses: actions/checkout@v4
      - name: Set up matching host CPython 3.14 interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
      - name: Install real build prerequisites (host tools only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build git python3 ccache binutils file curl libeigen3-dev
          python3 -m pip install --disable-pip-version-check 'pybind11==3.0.1'
          mkdir -p out/full-freecad "$CCACHE_DIR"
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
      - name: Restore verified OCCT Android modeling SDK (no kernel rebuild)
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: out/occt-android
          key: occt-install-android-arm64-V7_9_3-ndk27.2-api26-v1-${{ hashFiles('scripts/build-occt-android.sh', 'scripts/verify-android-elf.sh') }}
      - name: Restore Qt6 Android ARM64 SDK
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt6-android-arm64-v6.8.3-host-linux-qtbase-v1-${{ hashFiles('full-port/verify-qt-android.sh', 'full-port/bootstrap-qt.sh') }}
      - name: Restore yaml-cpp Android ARM64 library
        id: yaml
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/yaml-cpp
          key: drnas-yaml-cpp-0.8.0-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-yaml-android.sh') }}
      - name: Restore verified Android ICU uc, i18n, data
        id: icu
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/icu
          key: drnas-icu75-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-icu-android.sh') }}
      - name: Restore verified official CPython Android embed SDK
        id: python
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/python
          key: drnas-python-3.14.8-official-android-arm64-v1-${{ hashFiles('full-port/bootstrap-python-android.sh') }}
      - name: Restore verified Xerces-C Android Bionic SDK
        id: xerces
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/xerces-c
          key: drnas-xerces325-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-xerces-android.sh') }}
      - name: Refuse any accidental host ABI mixing
        run: |
          test "${{ steps.occt.outputs.cache-hit }}" = true || { echo "::error::No verified OCCT Android SDK"; exit 1; }
          test "${{ steps.qt.outputs.cache-hit }}" = true || { echo "::error::No verified Android Qt6 SDK"; exit 1; }
          test "${{ steps.yaml.outputs.cache-hit }}" = true || { echo "::error::No verified Android yaml-cpp SDK"; exit 1; }
          test "${{ steps.icu.outputs.cache-hit }}" = true || { echo "::error::No verified ICU Android SDK"; exit 1; }
          test "${{ steps.python.outputs.cache-hit }}" = true || { echo "::error::No verified CPython Android SDK"; exit 1; }
          test "${{ steps.xerces.outputs.cache-hit }}" = true || { echo "::error::No verified Xerces Android SDK"; exit 1; }
          test -f out/occt-android/lib/libTKBO.so
          test -f out/full-deps/qt/$QT_VERSION/android_arm64_v8a/lib/cmake/Qt6/Qt6Config.cmake
          bash scripts/verify-android-elf.sh "$GITHUB_WORKSPACE/out/occt-android"
      - name: Restore full core incremental C++ compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/full-freecad
          key: full-freecad-android-arm64-ndk27-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            full-freecad-android-arm64-ndk27-
      - name: Restore verified Boost Android libraries
        id: boost
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/boost
          key: drnas-boost188-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-boost-android.sh') }}
      - name: Build real Boost libraries for Android
        if: steps.boost.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-boost-android.sh
      - name: Save verified Boost Android libraries
        if: steps.boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/boost
          key: drnas-boost188-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-boost-android.sh') }}
      - name: Attempt full FreeCAD source CMake + compile real libraries
        id: build
        run: bash full-port/build-full-core.sh
      - name: Compiler cache diagnostics
        if: always()
        run: ccache --show-stats || true
      - name: Save partial FreeCAD compiler progress (including on failures)
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache/full-freecad
          key: full-freecad-android-arm64-ndk27-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload honest full upstream build logs and dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-full-freecad-android-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-freecad/
          if-no-files-found: warn
          retention-days: 30
