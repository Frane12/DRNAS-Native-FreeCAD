name: Start verified ARM64 bindings and APK pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  start-sequential-build:
    name: Preflight build source and start maintained ARM64 pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Validate maintained build source before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/feature/arm64-python-bindings-gates" --jq .commit.sha
          gh api "repos/$GITHUB_REPOSITORY/contents/full-port/build-bindings-stage.sh?ref=feature/arm64-python-bindings-gates" --jq .sha
      - name: Start sequential dependency build with automatic APK integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-bindings-sequential-pipeline.yml/dispatches" -f ref=feature/arm64-python-bindings-gates
          echo 'Build requested on feature/arm64-python-bindings-gates. Follow that run for compilation and APK integration; this launcher does not compile an APK.' >> "$GITHUB_STEP_SUMMARY"
