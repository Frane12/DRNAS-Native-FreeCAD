name: ARM64 Python bindings dependency pipeline
on:
  push:
    branches: [feature/arm64-python-bindings-gates]
    paths:
      - '.github/workflows/android-bindings-sequential-pipeline.yml'
      - 'full-port/*bindings*'
      - 'full-port/bootstrap-qt.sh'
      - 'full-port/bootstrap-python-android.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-bindings-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  QT_VERSION: '6.8.3'
  ANDROID_API: '26'
  NDK_VERSION: '27.2.12479018'
  CCACHE_DIR: ${{ github.workspace }}/.cache/bindings-ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: 'true'
jobs:
  bindings:
    name: Host tools → Shiboken → PySide6 → Coin3D → Pivy → ARM64 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Supported host Python for Qt 6.8 generator (target remains CPython 3.14)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate workflow and every shell step before building
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 full-port/check-bindings-workflow.py
      - name: Install host tools and Android NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libclang-dev llvm-dev patchelf swig libgl-dev libegl-dev libxcb-cursor0
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          mkdir -p out/bindings/logs
      - name: Prepare isolated host ICU runtime
        run: bash full-port/build-bindings-stage.sh host-deps
      - name: Restore compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/bindings-ccache
          key: bindings-ccache-arm64-ndk27-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bindings-ccache-arm64-ndk27-
      - name: Restore existing Qt Android and host SDK
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt-gui-6.8.3-arm64-v1-${{ hashFiles('full-gui/bootstrap-qt-gui-android.sh', 'full-port/bootstrap-qt.sh', 'full-port/verify-qt-android.sh') }}
      - name: Prepare Qt SDK when not cached
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          bash full-port/bootstrap-qt.sh
          bash full-gui/bootstrap-qt-gui-android.sh
      - name: Save verified Qt SDK immediately
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/qt
          key: ${{ steps.qt.outputs.cache-primary-key }}
      - name: Restore official Android CPython SDK
        id: python
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/python
          key: drnas-python-3.14.8-official-android-arm64-v1-${{ hashFiles('full-port/bootstrap-python-android.sh') }}
      - name: Prepare target CPython when not cached
        if: steps.python.outputs.cache-hit != 'true'
        run: bash full-port/bootstrap-python-android.sh
      - name: Save target Python SDK immediately
        if: steps.python.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/python
          key: ${{ steps.python.outputs.cache-primary-key }}
      - name: Fetch pinned matching sources
        run: bash full-port/build-bindings-stage.sh sources
      - name: Build Linux Shiboken generator and validate host dependencies
        run: bash full-port/build-bindings-stage.sh host
      - name: Restore completed shiboken SDK checkpoint
        id: shiboken
        uses: actions/cache/restore@v4
        with:
          path: out/bindings/shiboken-sdk.tar.gz
          key: bindings-shiboken-arm64-qt683-py314-ndk27-v2-${{ hashFiles('full-port/build-bindings-stage.sh') }}
      - name: Build or verify cached shiboken Android ARM64 SDK
        run: |
          set -euo pipefail
          if [[ "${{ steps.shiboken.outputs.cache-hit }}" == true ]]; then
            mkdir -p out/bindings/target
            tar xzf out/bindings/shiboken-sdk.tar.gz -C out/bindings/target
            bash scripts/verify-android-elf.sh out/bindings/target
          else
            bash full-port/build-bindings-stage.sh shiboken
          fi
      - name: Save successful shiboken checkpoint before next stage
        if: steps.shiboken.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/bindings/shiboken-sdk.tar.gz
          key: ${{ steps.shiboken.outputs.cache-primary-key }}
      - name: Preserve full shiboken SDK with headers and CMake metadata
        uses: actions/upload-artifact@v4
        with:
          name: shiboken-stage
          path: out/bindings/shiboken-sdk.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Restore completed pyside6 SDK checkpoint
        id: pyside6
        uses: actions/cache/restore@v4
        with:
          path: out/bindings/pyside6-sdk.tar.gz
          key: bindings-pyside6-arm64-qt683-py314-ndk27-v2-${{ hashFiles('full-port/build-bindings-stage.sh') }}
      - name: Build or verify cached pyside6 Android ARM64 SDK
        run: |
          set -euo pipefail
          if [[ "${{ steps.pyside6.outputs.cache-hit }}" == true ]]; then
            mkdir -p out/bindings/target
            tar xzf out/bindings/pyside6-sdk.tar.gz -C out/bindings/target
            bash scripts/verify-android-elf.sh out/bindings/target
          else
            bash full-port/build-bindings-stage.sh pyside6
          fi
      - name: Save successful pyside6 checkpoint before next stage
        if: steps.pyside6.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/bindings/pyside6-sdk.tar.gz
          key: ${{ steps.pyside6.outputs.cache-primary-key }}
      - name: Preserve full pyside6 SDK with headers and CMake metadata
        uses: actions/upload-artifact@v4
        with:
          name: pyside6-stage
          path: out/bindings/pyside6-sdk.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Restore Android GL4ES and GLU
        id: gl
        uses: actions/cache/restore@v4
        with:
          path: out/upstream-freecad-gui/opengl-compat
          key: freecadgui-gl4es-glu-arm64-a025615-2fed2bd-v1-${{ hashFiles('full-gui/upstream/build-android-gl4es-glu.sh') }}
      - name: Build real Android OpenGL compatibility libraries when missing
        if: steps.gl.outputs.cache-hit != 'true'
        run: bash full-gui/upstream/build-android-gl4es-glu.sh
      - name: Save Android OpenGL SDK immediately
        if: steps.gl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/upstream-freecad-gui/opengl-compat
          key: ${{ steps.gl.outputs.cache-primary-key }}
      - name: Restore completed coin3d SDK checkpoint
        id: coin3d
        uses: actions/cache/restore@v4
        with:
          path: out/bindings/coin3d-sdk.tar.gz
          key: bindings-coin3d-arm64-qt683-py314-ndk27-v2-${{ hashFiles('full-port/build-bindings-stage.sh') }}
      - name: Build or verify cached coin3d Android ARM64 SDK
        run: |
          set -euo pipefail
          if [[ "${{ steps.coin3d.outputs.cache-hit }}" == true ]]; then
            mkdir -p out/bindings/target
            tar xzf out/bindings/coin3d-sdk.tar.gz -C out/bindings/target
            bash scripts/verify-android-elf.sh out/bindings/target
          else
            bash full-port/build-bindings-stage.sh coin3d
          fi
      - name: Save successful coin3d checkpoint before next stage
        if: steps.coin3d.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/bindings/coin3d-sdk.tar.gz
          key: ${{ steps.coin3d.outputs.cache-primary-key }}
      - name: Preserve full coin3d SDK with headers and CMake metadata
        uses: actions/upload-artifact@v4
        with:
          name: coin3d-stage
          path: out/bindings/coin3d-sdk.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Restore completed pivy SDK checkpoint
        id: pivy
        uses: actions/cache/restore@v4
        with:
          path: out/bindings/pivy-sdk.tar.gz
          key: bindings-pivy-arm64-qt683-py314-ndk27-v2-${{ hashFiles('full-port/build-bindings-stage.sh') }}
      - name: Build or verify cached pivy Android ARM64 SDK
        run: |
          set -euo pipefail
          if [[ "${{ steps.pivy.outputs.cache-hit }}" == true ]]; then
            mkdir -p out/bindings/target
            tar xzf out/bindings/pivy-sdk.tar.gz -C out/bindings/target
            bash scripts/verify-android-elf.sh out/bindings/target
          else
            bash full-port/build-bindings-stage.sh pivy
          fi
      - name: Save successful pivy checkpoint before next stage
        if: steps.pivy.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/bindings/pivy-sdk.tar.gz
          key: ${{ steps.pivy.outputs.cache-primary-key }}
      - name: Preserve full pivy SDK with headers and CMake metadata
        uses: actions/upload-artifact@v4
        with:
          name: pivy-stage
          path: out/bindings/pivy-sdk.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Audit and package complete runtime bindings
        run: bash full-port/build-bindings-stage.sh bundle
      - name: Upload verified ARM64 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-python-bindings-arm64
          path: |
            out/bindings/android-python-bindings-arm64.tar.gz
            out/bindings/android-python-bindings-arm64.sha256
            out/bindings/STATUS.txt
          if-no-files-found: error
      - name: Save compiler cache even if a later stage failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/bindings-ccache
          key: bindings-ccache-arm64-ndk27-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bindings-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/bindings/logs/
            out/full-freecad/*log
            .build/shiboken/CMakeCache.txt
            .build/pyside6-arm64/CMakeCache.txt
            .build/coin-arm64/CMakeCache.txt
            .build/pivy-arm64/CMakeCache.txt
          if-no-files-found: warn
