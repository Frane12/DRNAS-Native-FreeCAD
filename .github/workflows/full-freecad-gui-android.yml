name: DRNAS FreeCAD Upstream GUI - Qt Android ARM64 Phase 1
on:
  push:
    branches: [feature/full-freecad-android]
    paths:
      - 'full-gui/**'
      - '.github/workflows/full-freecad-gui-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '26'

concurrency:
  group: drnas-freecad-real-gui-qt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qt-gui:
    name: Cross-link real Qt6 Widgets and OpenGLWidgets for Android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install Android GUI compiler prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3-venv binutils file curl
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          mkdir -p out/full-gui
      - name: Restore previously verified Qt GUI SDK
        uses: actions/cache/restore@v4
        id: gui
        with:
          path: out/full-deps/qt
          key: drnas-qt-gui-6.8.3-arm64-v1-${{ hashFiles('full-gui/bootstrap-qt-gui-android.sh', 'full-port/bootstrap-qt.sh', 'full-port/verify-qt-android.sh') }}
      - name: Restore existing Qt6 Android base/tools SDK when GUI cache absent
        if: steps.gui.outputs.cache-hit != 'true'
        id: base
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt6-android-arm64-v6.8.3-host-linux-qtbase-v1-${{ hashFiles('full-port/verify-qt-android.sh', 'full-port/bootstrap-qt.sh') }}
      - name: Require actual verified Android Qt base rather than build from scratch
        run: |
          test -f out/full-deps/qt/$QT_VERSION/android_arm64_v8a/lib/cmake/Qt6Core/Qt6CoreConfig.cmake
          test -f out/full-deps/qt/$QT_VERSION/android_arm64_v8a/lib/cmake/Qt6Widgets/Qt6WidgetsConfig.cmake
          test -f out/full-deps/qt/$QT_VERSION/gcc_64/bin/qmake6
      - name: Add QtSvg and cross-compile a functional Qt Widgets/CAD GUI shell
        id: gui_compile
        run: bash full-gui/bootstrap-qt-gui-android.sh
      - name: Save verified Qt GUI Android SDK including QtSvg
        if: steps.gui.outputs.cache-hit != 'true' && steps.gui_compile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt-gui-6.8.3-arm64-v1-${{ hashFiles('full-gui/bootstrap-qt-gui-android.sh', 'full-port/bootstrap-qt.sh', 'full-port/verify-qt-android.sh') }}
      - name: Preserve real Qt Android GUI .so and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-Real-FreeCAD-Qt-GUI-Phase1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-gui/
          if-no-files-found: warn
          retention-days: 30
