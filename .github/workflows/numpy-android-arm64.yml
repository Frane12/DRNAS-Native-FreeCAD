name: DRNAS NumPy Android ARM64 CPython 3.14
on:
  workflow_dispatch:
  push:
    branches: [feature/full-freecad-android]
    paths:
      - '.github/workflows/numpy-android-arm64.yml'
permissions:
  contents: read
  actions: write
jobs:
  numpy-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pinned NumPy release
        uses: actions/checkout@v4
        with:
          repository: numpy/numpy
          ref: v2.5.4
          persist-credentials: false
          submodules: recursive
      - name: Verify vendored Meson submodule
        run: test -s vendored-meson/meson/meson.py
      - name: Host build tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'cibuildwheel>=3.2,<4'
      - name: Repair Android CPython pkg-config linker metadata
        run: |
          set -euo pipefail
          # cibuildwheel creates its own Android CPython prefix after this
          # step. Patch the metadata inside its before-build hook instead.
          cat > $GITHUB_WORKSPACE/.drnas-fix-python-pc.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          pcdir="${PKG_CONFIG_LIBDIR:-}"
          test -n "$pcdir" && test -d "$pcdir"
          python3 - "$pcdir" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          found=0
          import re
          for pc in root.glob('*.pc'):
              content=pc.read_text()
              updated=re.sub(r'\\$\\(BLDLIBRARY\\)|\\$\\{BLDLIBRARY\\}', '-lpython3.14', content)
              # Some Android CPython pkg-config files expose an unresolved
              # make variable via a nested pkg-config variable definition.
              updated=re.sub(r'(?m)^BLDLIBRARY=.*          PY
          SH
          chmod +x $GITHUB_WORKSPACE/.drnas-fix-python-pc.sh
      - name: Cross-build CPython 3.14 Android ARM64 NumPy wheel
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp314-android_arm64_v8a
          CIBW_ARCHS_ANDROID: arm64_v8a
          CIBW_ENVIRONMENT_ANDROID: 'NPY_DISABLE_SVML=1'
          CIBW_BUILD_VERBOSITY: '1'
          # Upstream wheel hooks otherwise download Linux x86_64 OpenBLAS.
          CIBW_BEFORE_BUILD: 'bash {project}/.drnas-fix-python-pc.sh'
          CIBW_CONFIG_SETTINGS: 'setup-args=-Dblas=none setup-args=-Dlapack=none setup-args=-Dallow-noblas=true'
        run: python3 -m cibuildwheel --platform android --archs arm64_v8a --output-dir wheelhouse
      - name: Verify wheel tag and binary ABI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          wheels=list(Path('wheelhouse').glob('numpy-*.whl'))
          assert len(wheels)==1, f'Expected one NumPy wheel: {wheels}'
          wheel=wheels[0]
          assert 'cp314' in wheel.name and 'android' in wheel.name and 'arm64' in wheel.name, wheel.name
          with zipfile.ZipFile(wheel) as z:
              so=[p for p in z.namelist() if p.startswith('numpy/') and p.endswith('.so')]
              assert so, 'NumPy missing native extensions'
              assert any('_multiarray_umath' in p for p in so), 'Missing core extension'
              for name in so:
                  data=z.read(name)
                  assert data[:4]==b'\\x7fELF', name
                  assert int.from_bytes(data[18:20],'little')==183, f'Not AArch64: {name}'
              print('PASS:',wheel.name,'ARM64 native extensions:',len(so))
          PY
      - name: Upload genuine Android NumPy wheel
        uses: actions/upload-artifact@v4
        with:
          name: drnas-numpy-cp314-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
      - name: Dispatch FreeCAD APK integration only after successful wheel verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/freecadgui-qtactivity-native-apk.yml/dispatches" \
            -f ref=feature/full-freecad-android \
            -f 'inputs[numpy_run_id]=${{ github.run_id }}'
, 'BLDLIBRARY=-lpython3.14', updated)
              if updated != content:
                  pc.write_text(updated)
                  found+=1
          import subprocess
          result=subprocess.check_output(['pkg-config','--define-prefix','--libs','python3'],text=True)
          print('Python pkg-config libs:',result.strip())
          if 'BLDLIBRARY' in result:
              raise SystemExit('Unresolved Python linker metadata remains')
          print('Fixed Python pkg-config files:',found)
          PY
          SH
          chmod +x $GITHUB_WORKSPACE/.drnas-fix-python-pc.sh
      - name: Cross-build CPython 3.14 Android ARM64 NumPy wheel
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp314-android_arm64_v8a
          CIBW_ARCHS_ANDROID: arm64_v8a
          CIBW_ENVIRONMENT_ANDROID: 'NPY_DISABLE_SVML=1'
          CIBW_BUILD_VERBOSITY: '1'
          # Upstream wheel hooks otherwise download Linux x86_64 OpenBLAS.
          CIBW_BEFORE_BUILD: 'bash {project}/.drnas-fix-python-pc.sh'
          CIBW_CONFIG_SETTINGS: 'setup-args=-Dblas=none setup-args=-Dlapack=none setup-args=-Dallow-noblas=true'
        run: python3 -m cibuildwheel --platform android --archs arm64_v8a --output-dir wheelhouse
      - name: Verify wheel tag and binary ABI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          wheels=list(Path('wheelhouse').glob('numpy-*.whl'))
          assert len(wheels)==1, f'Expected one NumPy wheel: {wheels}'
          wheel=wheels[0]
          assert 'cp314' in wheel.name and 'android' in wheel.name and 'arm64' in wheel.name, wheel.name
          with zipfile.ZipFile(wheel) as z:
              so=[p for p in z.namelist() if p.startswith('numpy/') and p.endswith('.so')]
              assert so, 'NumPy missing native extensions'
              assert any('_multiarray_umath' in p for p in so), 'Missing core extension'
              for name in so:
                  data=z.read(name)
                  assert data[:4]==b'\\x7fELF', name
                  assert int.from_bytes(data[18:20],'little')==183, f'Not AArch64: {name}'
              print('PASS:',wheel.name,'ARM64 native extensions:',len(so))
          PY
      - name: Upload genuine Android NumPy wheel
        uses: actions/upload-artifact@v4
        with:
          name: drnas-numpy-cp314-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
      - name: Dispatch FreeCAD APK integration only after successful wheel verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/freecadgui-qtactivity-native-apk.yml/dispatches" \
            -f ref=feature/full-freecad-android \
            -f 'inputs[numpy_run_id]=${{ github.run_id }}'
