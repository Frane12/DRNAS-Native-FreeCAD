name: DRNAS NumPy Android ARM64 CPython 3.14
on:
  workflow_dispatch:
  push:
    branches: [feature/full-freecad-android]
    paths:
      - '.github/workflows/numpy-android-arm64.yml'
permissions:
  contents: read
  actions: write
jobs:
  numpy-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pinned NumPy release
        uses: actions/checkout@v4
        with:
          repository: numpy/numpy
          ref: v2.5.4
          persist-credentials: false
          submodules: recursive
      - name: Verify vendored Meson submodule
        run: test -s vendored-meson/meson/meson.py
      - name: Host build tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'cibuildwheel>=3.2,<4' 'wheel>=0.45'
      - name: Repair Android CPython pkg-config linker metadata
        run: |
          set -euo pipefail
          # cibuildwheel creates its own Android CPython prefix after this
          # step. Patch the metadata inside its before-build hook instead.
          cat > $GITHUB_WORKSPACE/.drnas-fix-python-pc.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import glob, subprocess
          roots = [Path(p) for p in glob.glob('/tmp/cibw-run-*/cp314-android_arm64_v8a/python/prefix/lib/pkgconfig')]
          if not roots:
              raise SystemExit('PRE-FLIGHT FAILED: Android CPython pkgconfig directory not found')
          count = 0
          for root in roots:
              for pc in root.glob('*.pc'):
                  original = pc.read_text()
                  fixed = original.replace('$(BLDLIBRARY)', '-lpython3.14').replace('${BLDLIBRARY}', '-lpython3.14')
                  if fixed != original:
                      pc.write_text(fixed)
                      count += 1
              env = __import__('os').environ.copy()
              env['PKG_CONFIG_LIBDIR'] = str(root)
              env['PKG_CONFIG_PATH'] = ''
              for pkg in ('python3', 'python-3.14', 'python-3.14-embed'):
                  p = subprocess.run(['pkg-config', '--define-prefix', '--libs', pkg], env=env, capture_output=True, text=True)
                  if p.returncode == 0:
                      print(pkg, p.stdout.strip())
                      if 'BLDLIBRARY' in p.stdout:
                          raise SystemExit('PRE-FLIGHT FAILED: unresolved BLDLIBRARY in '+pkg)
              print('Android CPython prefix:', root.parent.parent)
          print('Fixed pkg-config files:', count)
          if count == 0:
              raise SystemExit('PRE-FLIGHT FAILED: no linker metadata was repaired')
          PY
          SH
          chmod +x $GITHUB_WORKSPACE/.drnas-fix-python-pc.sh
      - name: Set Android ARM64 long double format for Meson cross build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('numpy/_core/meson.build')
          src=p.read_text()
          needle="longdouble_format = meson.get_external_property('longdouble_format', 'UNKNOWN')"
          assert src.count(needle)==1, 'NumPy longdouble probe changed upstream'
          src=src.replace(needle, """# Android AArch64 uses IEEE-754 binary128 little-endian long double.
          # Avoid executing a target binary on the x86_64 GitHub runner.
          longdouble_format = meson.get_external_property('longdouble_format', 'UNKNOWN')
          if host_machine.system() == 'android' and host_machine.cpu_family() == 'aarch64'
            longdouble_format = 'IEEE_QUAD_LE'
          endif""")
          p.write_text(src)
          print('Patched target-only long double detection for Android AArch64')
          PY
      - name: Cross-build CPython 3.14 Android ARM64 NumPy wheel
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp314-android_arm64_v8a
          CIBW_ARCHS_ANDROID: arm64_v8a
          CIBW_ENVIRONMENT_ANDROID: 'NPY_DISABLE_SVML=1'
          CIBW_BUILD_VERBOSITY: '1'
          # Upstream wheel hooks otherwise download Linux x86_64 OpenBLAS.
          CIBW_BEFORE_BUILD: 'bash {project}/.drnas-fix-python-pc.sh'
          CIBW_CONFIG_SETTINGS: 'setup-args=-Dblas=none setup-args=-Dlapack=none setup-args=-Dallow-noblas=true'
        run: python3 -m cibuildwheel --platform android --archs arm64_v8a --output-dir wheelhouse
      - name: Verify wheel tag and binary ABI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          wheels=list(Path('wheelhouse').glob('numpy-*.whl'))
          assert len(wheels)==1, f'Expected one NumPy wheel: {wheels}'
          wheel=wheels[0]
          assert 'cp314' in wheel.name and 'android' in wheel.name and 'arm64' in wheel.name, wheel.name
          with zipfile.ZipFile(wheel) as z:
              so=[p for p in z.namelist() if p.startswith('numpy/') and p.endswith('.so')]
              assert so, 'NumPy missing native extensions'
              assert any('_multiarray_umath' in p for p in so), 'Missing core extension'
              for name in so:
                  data=z.read(name)
                  assert data[:4]==b'\\x7fELF', name
                  assert int.from_bytes(data[18:20],'little')==183, f'Not AArch64: {name}'
              print('PASS:',wheel.name,'ARM64 native extensions:',len(so))
          PY
      - name: Upload genuine Android NumPy wheel
        uses: actions/upload-artifact@v4
        with:
          name: drnas-numpy-cp314-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
      - name: Dispatch FreeCAD APK integration only after successful wheel verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/freecadgui-qtactivity-native-apk.yml/dispatches" \
            -f ref=feature/full-freecad-android \
            -f 'inputs[numpy_run_id]=${{ github.run_id }}'
