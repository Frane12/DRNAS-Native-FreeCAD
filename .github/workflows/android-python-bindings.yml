name: DRNAS Native Android Python Bindings Build
on:
  push:
    branches: [feature/full-freecad-android]
    paths:
      - 'full-gui/upstream/build-python-bindings-android.sh'
      - '.github/workflows/android-python-bindings.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  NDK_VERSION: '27.2.12479018'
jobs:
  build-native-shiboken:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
      - name: Install real native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang git libclang-dev llvm-dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk:$NDK_VERSION"
      - uses: actions/cache/restore@v4
        id: qt
        with:
          path: out/full-deps/qt
          key: ${{ format('drnas-qt-gui-6.8.3-arm64-v1-{0}', hashFiles('full-gui/bootstrap-qt-gui-android.sh', 'full-port/bootstrap-qt.sh', 'full-port/verify-qt-android.sh')) }}
      - uses: actions/cache/restore@v4
        id: python
        with:
          path: out/full-deps/python
          key: ${{ format('drnas-python-3.14.8-official-android-arm64-v1-{0}', hashFiles('full-port/bootstrap-python-android.sh')) }}
      - name: Require verified Android SDK caches
        run: |
          test "${{ steps.qt.outputs.cache-hit }}" = true
          test "${{ steps.python.outputs.cache-hit }}" = true
      - name: Cross-compile genuine shiboken6 target
        run: bash full-gui/upstream/build-python-bindings-android.sh
      - name: Save native binding build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-Android-Python-Bindings-${{ github.run_id }}
          path: out/android-python-bindings/
          if-no-files-found: warn
