name: DRNAS FreeCAD - Android CAD Smoke APK
on:
  push:
    branches: [main]
    paths:
      - 'android-smoke/**'
      - '.github/workflows/cad-smoke-apk.yml'
      - 'native-tests/drnas_occt_geometry.cpp'
      - 'native-tests/drnas_occt_geometry.h'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occt-android-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '26'
  CCACHE_DIR: ${{ github.workspace }}/.cache/apk-smoke
  CCACHE_MAXSIZE: '128M'

jobs:
  apk:
    name: Package native OCCT CAD into isolated Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle build and dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Install Android SDK components and compiler cache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache binutils file
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' "ndk;$NDK_VERSION"
          mkdir -p out "$CCACHE_DIR"
      - name: Restore verified OCCT Android CAD kernel, no rebuild
        id: occt_cache
        uses: actions/cache/restore@v4
        with:
          path: out/occt-android
          key: occt-install-android-arm64-V7_9_3-ndk27.2-api26-v1-${{ hashFiles('scripts/build-occt-android.sh', 'scripts/verify-android-elf.sh') }}
      - name: Require successful native OCCT cache
        run: |
          test "${{ steps.occt_cache.outputs.cache-hit }}" = true ||
            { echo "::error::Native CAD cache missing; phase 1 must be built first"; exit 1; }
      - name: Restore native JNI compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/apk-smoke
          key: freecad-apk-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            freecad-apk-ccache-
      - name: Build JNI bridge and stage OCCT Android dependencies
        id: native
        run: bash android-smoke/stage-native.sh
      - name: Build Android ARM64 smoke APK
        id: gradle
        run: |
          cd android-smoke
          gradle --no-daemon :app:assembleDebug
      - name: Validate APK signing, package and native libraries
        run: |
          set -euo pipefail
          mkdir -p out/apk-smoke
          cp android-smoke/app/build/outputs/apk/debug/app-debug.apk out/apk-smoke/DRNAS-FreeCAD-CAD-Smoke-arm64-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/apk-smoke/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/apk-smoke/*.apk | grep -E 'package:|native-code:'
          unzip -l out/apk-smoke/*.apk | grep 'lib/arm64-v8a/libdrnas_freecad_smoke.so'
          sha256sum out/apk-smoke/*.apk > out/apk-smoke/SHA256SUMS.txt
      - name: Compiler cache report
        if: always()
        run: ccache --show-stats || true
      - name: Save native cache, including partial builds
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache/apk-smoke
          key: freecad-apk-ccache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload APK and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-FreeCAD-CAD-Smoke-ARM64-APK-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/apk-smoke/
          if-no-files-found: warn
          retention-days: 30
