name: DRNAS FreeCADGui QtActivity APK Integration
# Repackage the already-compiled native FreeCAD artifact when Android-only
# integration changes. No full FreeCAD C++ rebuild is triggered on these paths.
# The main-branch workflow_run controller still dispatches packaging after a
# genuinely new successful native GUI build.
on:
  push:
    branches: [feature/full-freecad-android, diagnostics/partdesign-shiboken-20261026]
    paths:
      - '.github/workflows/freecadgui-qtactivity-native-apk.yml'
      - 'full-gui/integrated-apk/**'
      - 'full-gui/qt-activity/**'
  # The diagnostic PR inherits trusted feature-branch Qt/OCCT/Python caches.
  pull_request:
    branches: [feature/full-freecad-android]
    paths:
      - '.github/workflows/freecadgui-qtactivity-native-apk.yml'
      - 'full-gui/integrated-apk/**'
      - 'full-gui/qt-activity/**'
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: 'Successful upstream FreeCADGui run ID (empty = latest success)'
        type: string
        required: false
      numpy_run_id:
        description: 'Successful NumPy Android ARM64 wheel workflow run ID'
        type: string
        required: false
      bindings_run_id:
        description: 'Successful sequential ARM64 bindings run (empty = latest success)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: drnas-real-freecadgui-qtapk-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '26'

jobs:
  package-real-gui:
    # Always dispatched on feature/full-freecad-android: feature caches for
    # Qt6, ICU, OCCT and Python cannot be read from default branch jobs.
    # Diagnostic branch packages only AFTER the successful native build dispatch.
    # Its push has no native ARM64 artifact yet; avoid a misleading early failure.
    if: (github.event_name == 'pull_request' && (github.head_ref == 'diagnostics/partdesign-shiboken-20261026' || github.head_ref == 'diagnostics/sketcher-rectangle-ovp-20261026' || github.head_ref == 'diagnostics/sketcher-icon-alpha-20261026' || github.head_ref == 'diagnostics/sketcher-native-icon-capture-20261026' || github.head_ref == 'diagnostics/sketcher-raster-20261026' || github.head_ref == 'fix/android-deferred-measure-ui-20261026' || github.head_ref == 'fix/android-sketch-plane-picker-20261026' || github.head_ref == 'fix/android-camera-navigation-20261027' || github.head_ref == 'experiment/android-view-animation-menu-20261027' || github.head_ref == 'diagnostics/gl-invalid-enum-20261027') && github.base_ref == 'feature/full-freecad-android') || (github.ref == 'refs/heads/feature/full-freecad-android' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[native-probe]'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostics/partdesign-shiboken-20261026')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Preflight successful ARM64 binding build provenance
        id: bindings
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BINDINGS_RUN: ${{ inputs.bindings_run_id }}
        run: |
          set -euo pipefail
          run="${INPUT_BINDINGS_RUN:-39941334444}"
          if [[ -z "$run" ]]; then
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=feature/arm64-python-bindings-gates&status=success&per_page=50" --jq '[.workflow_runs[] | select(.path == ".github/workflows/android-bindings-sequential-pipeline.yml")][0].id')"
          fi
          [[ "$run" =~ ^[0-9]+$ ]] || { echo "::error::No successful ARM64 bindings run available"; exit 1; }
          for attempt in {1..12}; do
            info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            [[ "$(jq -r '.status' <<< "$info")" == completed ]] && break
            sleep 5
          done
          test "$(jq -r '.conclusion' <<< "$info")" = success
          test "$(jq -r '.head_branch' <<< "$info")" = feature/arm64-python-bindings-gates
          test "$(jq -r '.head_repository.full_name' <<< "$info")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.path' <<< "$info")" = .github/workflows/android-bindings-sequential-pipeline.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "android-python-bindings-arm64" and .expired == false) | .id' | grep -E '^[0-9]+$'
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Select successful native GUI artifact and immutable source commit
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.upstream_run_id }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          DIAG_PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reuse_native=0
          native_branch="$TARGET_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == pull_request && ( "$TARGET_BRANCH" == diagnostics/sketcher-rectangle-ovp-20261026 || "$TARGET_BRANCH" == diagnostics/sketcher-icon-alpha-20261026 ) ]]; then
            # Reuse precisely the phone-confirmed native 119 build: the only
            # source changes since that SHA are Android Qt glue and docs.
            baseline_sha=8a5b799fc5081fcd322448cc06962c8aaca783ed
            run_id=40329326848
            native_branch=feature/full-freecad-android
            reuse_native=1
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$baseline_sha...$DIAG_PR_COMMIT")"
            jq -e '(.status == "ahead" or .status == "identical") and
                (.total_commits <= 250) and ((.files | length) < 300) and
                ([.files[] | (.filename, (.previous_filename // "")) | select(length > 0) |
                  select((startswith("full-gui/qt-activity/") or
                          startswith("full-gui/integrated-apk/") or
                          startswith("tests/") or . == "AGENTS.md" or
                          . == "README.md" or . == "WORKING_BASELINE.md" or
                          . == ".github/workflows/freecadgui-qtactivity-native-apk.yml") | not)]
                 | length == 0)' <<< "$comparison" >/dev/null || {
              echo "::error::Native inputs changed since verified 119; refusing stale artifact"
              exit 1
            }
            echo "SKETCHER OVP: verified Android-only change; using native run $run_id"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Packaging-only changes can reuse a successful native compile when
            # GitHub confirms that none of its native build inputs changed.
            # The GLES diagnostic requires an exact-source native build WITH
            # the post-staging Coin marker gate; older apparently successful
            # native artifacts demonstrably contained a stale Coin DSO.
            latest=""
            if [[ "$TARGET_BRANCH" != diagnostics/gl-invalid-enum-20261027 ]]; then
              latest="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=${TARGET_BRANCH}&status=success&per_page=60" --jq '[.workflow_runs[] | select(.name == "DRNAS REAL upstream FreeCADGui Full ARM64 Build" and .event == "pull_request")][0].id // empty')"
            else
              echo "COIN_PROVENANCE: require exact-commit native run; refusing cached/prior GLES artifacts"
            fi
            run_id=""
            if [[ "$latest" =~ ^[0-9]+$ ]]; then
              native_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$latest" --jq .head_sha)"
              comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$native_sha...$DIAG_PR_COMMIT")"
              if jq -e '(.status == "ahead" or .status == "identical") and
                  (.total_commits <= 250) and ((.files | length) < 300)' <<< "$comparison" >/dev/null; then
                # Allowlist the complete diff: resources, Qt integration, tests,
                # and this packaging workflow; everything else requires compile.
                if jq -e '[.files[] | (.filename, (.previous_filename // "")) |
                    select(length > 0) |
                    select((startswith("full-gui/integrated-apk/") or
                            startswith("full-gui/qt-activity/") or
                            startswith("tests/") or
                            . == ".github/workflows/freecadgui-qtactivity-native-apk.yml") | not)] | length == 0' <<< "$comparison" >/dev/null; then
                  run_id="$latest"
                  reuse_native=1
                  echo "Verified packaging-only diff: reuse native $latest at $native_sha"
                fi
              fi
            fi
            # Native changes still require a successful exact-source compile.
            # Wait for the corresponding upstream build of this exact PR commit.
            for attempt_no in $(seq 1 150); do
              [[ "$run_id" =~ ^[0-9]+$ ]] && break
              native_list="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
              native_row="$(jq -c --arg sha "$DIAG_PR_COMMIT" '
                [.workflow_runs[]
                 | select(.name == "DRNAS REAL upstream FreeCADGui Full ARM64 Build"
                          and .event == "pull_request"
                          and .head_sha == $sha)]
                | sort_by(.id) | last // null' <<< "$native_list")"
              native_status="$(jq -r '.conclusion // .status // "pending"' <<< "$native_row")"
              native_id="$(jq -r '.id // empty' <<< "$native_row")"
              if [[ "$native_status" == success && "$native_id" =~ ^[0-9]+$ ]]; then
                run_id="$native_id"
                echo "Matching FreeCAD native build $run_id for $DIAG_PR_COMMIT is ready"
                break
              fi
              if [[ "$native_status" == failure || "$native_status" == cancelled ]]; then
                echo "::error::Matching FreeCAD native build ended $native_status"
                exit 1
              fi
              echo "Native build not yet successful for $DIAG_PR_COMMIT, attempt $attempt_no: $native_status"
              sleep 20
            done
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Matching native FreeCAD build not ready"; exit 1; }
          elif [[ -n "$INPUT_RUN_ID" ]]; then
            run_id="$INPUT_RUN_ID"
          elif [[ "$TARGET_BRANCH" == feature/full-freecad-android ]]; then
            baseline_run=40309325619
            baseline_sha=ee342e9b976b31e4b9601aac67554b8cbe8928b4
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$baseline_sha...$GITHUB_SHA")"
            if jq -e '(.status == "ahead" or .status == "identical") and
                (.total_commits <= 250) and ((.files | length) < 300) and
                ([.files[] | (.filename, (.previous_filename // "")) | select(length > 0) |
                  select((startswith("full-gui/integrated-apk/") or
                          startswith("full-gui/qt-activity/") or startswith("tests/") or
                          . == "AGENTS.md" or . == "README.md" or . == "WORKING_BASELINE.md" or
                          . == ".github/workflows/freecadgui-qtactivity-native-apk.yml" or
                          . == ".github/workflows/drnas-r264-async-file-open.yml") | not)] | length == 0)' <<< "$comparison" >/dev/null; then
              run_id="$baseline_run"
              native_branch=diagnostics/partdesign-shiboken-20261026
              echo "Verified unchanged native build inputs: reuse phone-confirmed APK 316 native run $run_id"
            else
              run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=${TARGET_BRANCH}&status=success&per_page=60" --jq '[.workflow_runs[] | select(.name == "DRNAS REAL upstream FreeCADGui Full ARM64 Build")][0].id // empty')"
            fi
          else
            # Always package the most recent verified native compile. The old
            # fixed run predates Android SAF and silently rejected new fixes.
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=${TARGET_BRANCH}&status=success&per_page=60" --jq '[.workflow_runs[] | select(.name == "DRNAS REAL upstream FreeCADGui Full ARM64 Build")][0].id // empty')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Invalid upstream run"; exit 1; }
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.conclusion' <<<"$info")" = success
          test "$(jq -r '.name' <<<"$info")" = 'DRNAS REAL upstream FreeCADGui Full ARM64 Build'
          test "$(jq -r '.head_branch' <<<"$info")" = "$native_branch"
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$reuse_native" != 1 ]]; then
            test "$(jq -r '.event' <<<"$info")" = pull_request
          fi
          test "$(jq -r '.head_repository.full_name' <<<"$info")" = "$GITHUB_REPOSITORY"
          if [[ "$native_branch" != "$TARGET_BRANCH" ]]; then
            test "$(jq -r '.head_sha' <<<"$info")" = "$baseline_sha"
          fi
          commit="$(jq -r '.head_sha' <<<"$info")"
          attempt="$(jq -r '.run_attempt' <<<"$info")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          # Package the latest integration glue on our trusted feature branch.
          # Native binary provenance remains pinned to the successful source SHA.
          package_sha="${DIAG_PR_COMMIT:-$GITHUB_SHA}"
          [[ "$package_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$reuse_native" != 1 ]]; then
            # A native input change requires identical native/APK source.
            test "$commit" = "$package_sha" || {
              echo "::error::Mismatched FreeCAD source commit and APK packaging commit"
              exit 1
            }
            echo "PASS: native and APK use identical PR source commit"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "package_sha=$package_sha" >> "$GITHUB_OUTPUT"
          echo "Packaging commit: $GITHUB_REPOSITORY@$package_sha; upstream binary source: $commit; successful upstream workflow run: $run_id / attempt $attempt"

      - name: Checkout pinned Android integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.upstream.outputs.package_sha }}
          persist-credentials: false

      - name: Regression-test Measure InitGui boot guard
        run: |
          python3 -m unittest discover -s tests -p 'test_measure_initgui_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_deferred_measure_ui.py' -v

      - name: Download real GUI, App, Base, Coin3D, GL4ES artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.upstream.outputs.run_id }}
          github-token: ${{ github.token }}
          name: DRNAS-Actual-Upstream-FreeCADGui-ARM64-${{ steps.upstream.outputs.run_id }}-${{ steps.upstream.outputs.attempt }}
          path: out/upstream-freecad-gui

      - name: Checkout original material and icon resources matching the native FreeCAD revision
        uses: actions/checkout@v4
        with:
          repository: FreeCAD/FreeCAD
          ref: d4ffc7f725973e073907746e88d320d3e438fd34
          path: .deps/freecad-runtime-resources
          persist-credentials: false
          sparse-checkout: |
            src/Mod/Material
            src/Mod/Part/Gui/Resources
            src/Mod/Sketcher/Gui/Resources
            src/Mod/PartDesign/Gui/Resources
            src/Mod/Measure
            src/Mod/BIM
            src/Mod/Draft
            src/3rdParty/lazy_loader

      - name: Stage and verify default material libraries before APK packaging
        run: |
          python3 full-gui/integrated-apk/stage-material-resources.py \
            .deps/freecad-runtime-resources out/upstream-freecad-gui/resources

      - name: Require complete original FreeCAD GUI/workbench/overlay resources
        run: |
          set -euo pipefail
          root=out/upstream-freecad-gui/resources
          if [[ ! -d "$root" ]]; then
            echo "::error::Upstream native GUI artifact lacks resources/. Select a successful full GUI run that includes 'Stage real native FreeCAD Part, Sketcher, PartDesign workbench UI and icons'."
            exit 1
          fi
          for module in Part Sketcher PartDesign Measure; do
            test -s "$root/Mod/$module/InitGui.py" || {
              echo "::error::Original $module/InitGui.py missing in upstream artifact"
              exit 1
            }
          done
          for icon in taskshow taskshow_lightgray editshow editshow_lightgray edithide edithide_lightgray float overlay close mode transparent autohide autohide_lightgray; do
            test -s "$root/data/Gui/Stylesheets/overlay/icons/$icon.svg" || {
              echo "::error::Missing upstream original overlay icon: $icon.svg"
              exit 1
            }
          done
          echo 'PASS: Genuine FreeCAD GUI workbenches and all on-device qss:overlay SVG icons are present.'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android tools and ELF relinker
        run: |
          set -euo pipefail
          timeout 600s sudo apt-get update
          timeout 600s sudo apt-get install -y --no-install-recommends cmake ninja-build patchelf binutils unzip file qt6-base-dev libegl1-mesa-dev libgles2-mesa-dev
          timeout 300s "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' "ndk;$NDK_VERSION"
          mkdir -p out/integrated-freecad-qtapk

      - name: Test GUI resize and real GL4ES state isolation before packaging
        run: bash full-gui/qt-activity/tests/check-render-isolation.sh

      - name: Test FCStd destination transfer and failure handling
        run: |
          mkdir -p .build/save-transfer-tests
          javac -d .build/save-transfer-tests \
            full-gui/qt-activity/android/src/org/drnas/freecad/bootstrap/FcstdTransfer.java \
            full-gui/qt-activity/tests/FcstdTransferTest.java
          java -cp .build/save-transfer-tests org.drnas.freecad.bootstrap.FcstdTransferTest

      - name: Restore Qt GUI 6.8.3 native SDK
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt-gui-6.8.3-arm64-v1-${{ hashFiles('full-gui/bootstrap-qt-gui-android.sh', 'full-port/bootstrap-qt.sh', 'full-port/verify-qt-android.sh') }}
      - name: Restore host ICU73 for Qt Android tooling
        id: hosticu
        uses: actions/cache/restore@v4
        with:
          path: out/full-gui/host-icu73
          key: drnas-qt-host-icu73-v1-${{ hashFiles('full-gui/bootstrap-icu73-host.sh') }}
      - name: Restore verified OCCT Android native SDK
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: out/occt-android
          key: occt-fullcad-android-arm64-V7_9_3-ndk27.2-api26-v1-${{ hashFiles('scripts/build-occt-android.sh', 'scripts/verify-android-elf.sh') }}
      - name: Restore native Boost
        id: boost
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/boost
          key: drnas-boost188-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-boost-android.sh') }}
      - name: Restore native ICU 75
        id: icu
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/icu
          key: drnas-icu75-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-icu-android.sh') }}
      - name: Restore native Python 3.14
        id: python
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/python
          key: drnas-python-3.14.8-official-android-arm64-v1-${{ hashFiles('full-port/bootstrap-python-android.sh') }}
      - name: Restore native Xerces-C
        id: xerces
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/xerces-c
          key: drnas-xerces325-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-xerces-android.sh') }}
      - name: Restore native yaml-cpp
        id: yaml
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/yaml-cpp
          key: drnas-yaml-cpp-0.8.0-android-arm64-ndk27-v1-${{ hashFiles('full-port/bootstrap-yaml-android.sh') }}

      - name: Validate ABI caches and native GUI artifact
        run: |
          set -euo pipefail
          for hit in "${{ steps.qt.outputs.cache-hit }}" "${{ steps.hosticu.outputs.cache-hit }}" \
             "${{ steps.occt.outputs.cache-hit }}" "${{ steps.boost.outputs.cache-hit }}" \
             "${{ steps.icu.outputs.cache-hit }}" "${{ steps.python.outputs.cache-hit }}" \
             "${{ steps.xerces.outputs.cache-hit }}" "${{ steps.yaml.outputs.cache-hit }}"; do
             test "$hit" = true || { echo "::error::Verified dependency cache missing"; exit 1; }
          done
          test -f out/full-gui/host-icu73/lib/libicui18n.so.73
          test -f out/upstream-freecad-gui/native/libFreeCADGui.so
          test -f out/upstream-freecad-gui/native/libCoin.so
          if [[ "${GITHUB_HEAD_REF:-}" == diagnostics/sketcher-native-icon-capture-20261026 ]]; then
            test -s out/upstream-freecad-gui/native/SketcherGui.so
            grep -aFq "SKETCHER_NATIVE_ICON" out/upstream-freecad-gui/native/SketcherGui.so || {
              echo "::error::SketcherGui.so lacks genuine image capture hook; refusing stale native artifact"
              exit 1
            }
          fi
          if [[ "${GITHUB_HEAD_REF:-}" == diagnostics/sketcher-raster-20261026 ]]; then
            readelf --dyn-syms --wide out/upstream-freecad-gui/opengl-compat/lib/libGL.so \
              | awk '$7 != "UND" && $8 == "drnas_gl4es_drawpixels_blend_v1" { found=1 } END { exit !found }' || {
              echo "::error::GL4ES lacks the isolated DrawPixels sampler/blend fix"
              exit 1
            }
          fi
          if [[ "${GITHUB_HEAD_REF:-}" == fix/android-deferred-measure-ui-20261026 ]]; then
            readelf --dyn-syms --wide out/upstream-freecad-gui/native/libFreeCADGui.so \
              | awk '$7 != "UND" && $8 == "drnas_android_deferred_measure_ui_v1" { found=1 } END { exit !found }' || {
              echo "::error::Native FreeCADGui lacks deferred Measure menu composition"
              exit 1
            }
          fi
          if [[ "${GITHUB_HEAD_REF:-}" == fix/android-sketch-plane-picker-20261026 ]]; then
            readelf --dyn-syms --wide out/upstream-freecad-gui/native/PartDesignGui.so \
              | awk '$7 != "UND" && $8 == "drnas_android_sketch_plane_picker_v1" { found=1 } END { exit !found }' || {
              echo "::error::PartDesignGui lacks Android sketch plane picker"
              exit 1
            }
          fi
          if [[ "${GITHUB_HEAD_REF:-}" == fix/android-camera-navigation-20261027 || "${GITHUB_HEAD_REF:-}" == experiment/android-view-animation-menu-20261027 ]]; then
            readelf --dyn-syms --wide out/upstream-freecad-gui/native/libFreeCADGui.so \
              | awk '$7 != "UND" && $8 == "drnas_android_direct_standard_views_v1" { found=1 } END { exit !found }' || {
              echo "::error::Native FreeCADGui lacks Android direct standard views"; exit 1;
            }
            grep -aFq 'VIEW_CMD 04 wrap main window' out/upstream-freecad-gui/native/libFreeCADGui.so || {
              echo "::error::Native FreeCADGui lacks view command diagnostics"; exit 1;
            }
            readelf --dyn-syms --wide out/upstream-freecad-gui/native/libFreeCADGui.so \
              | awk '$7 != "UND" && $8 == "drnas_android_camera_direct_v1" { found=1 } END { exit !found }' || {
              echo "::error::Native FreeCADGui lacks camera direct-orientation experiment"; exit 1;
            }
            readelf --dyn-syms --wide out/upstream-freecad-gui/native/PartDesignGui.so \
              | awk '$7 != "UND" && $8 == "drnas_android_sketch_plane_picker_v1" { found=1 } END { exit !found }' || {
              echo "::error::Native PartDesignGui lacks sketch plane picker"; exit 1;
            }
          fi
          if [[ "${GITHUB_HEAD_REF:-}" == experiment/android-view-animation-menu-20261027 ]]; then
            readelf --dyn-syms --wide out/upstream-freecad-gui/native/libFreeCADGui.so \
              | awk '$7 != "UND" && $8 == "drnas_android_camera_animation_v1" { found=1 } END { exit !found }' || {
              echo "::error::Native FreeCADGui lacks camera animation experiment"; exit 1;
            }
          fi
          # No silently repacking a pre-fix upstream library.
          test -f full-gui/qt-activity/android/src/org/drnas/freecad/bootstrap/AndroidDocumentBridge.java
          # Do not publish an APK with stale FreeCADApp/document restore objects.
          grep -aFq 'FCSTD_PRIVATE 11 set FileName' out/upstream-freecad-gui/native/libFreeCADApp.so || {
            echo "::error::FreeCADApp library lacks FCStd filename checkpoint"; exit 1;
          }
          grep -aFq 'FCSTD_RESTORE 25 document objects' out/upstream-freecad-gui/native/libFreeCADApp.so || {
            echo "::error::FreeCADApp library lacks FCStd restore checkpoint"; exit 1;
          }
          grep -aFq 'FCSTD_ZIP 30 first getNextEntry' out/upstream-freecad-gui/native/libFreeCADBase.so || {
            echo "::error::FreeCADBase library lacks ZIP embedded-entry diagnostic checkpoints"; exit 1;
          }
          if ! grep -aFq 'AndroidDocumentBridge' out/upstream-freecad-gui/native/libFreeCADGui.so; then
            echo "::error::Native FreeCADGui is older than the Android SAF file-open fix. Run upstream-freecadgui-full-android.yml first."
            exit 1
          fi
          # New GUI actions for probes 11/12 must NEVER be packaged with
          # yesterday's native libFreeCADGui.so lacking their implementation.
          if ! readelf --dyn-syms --wide out/upstream-freecad-gui/native/libFreeCADGui.so \
            | awk '$7 != "UND" && $8 == "drnas_geometry_document_probe_version" { found=1 } END { exit !found }'; then
            echo "::error::Native FreeCADGui lacks Coin3D real-document probes 11/12. Await the newest successful upstream ARM64 run; do not ship mixed sources."
            exit 1
          fi
          for mod in TKXSBase TKDESTEP TKDEIGES TKLCAF TKCAF; do
            test -s "out/occt-android/lib/lib${mod}.so" || { echo "::error::Missing complete OCCT lib${mod}.so"; exit 1; }
          done
          bash scripts/verify-android-elf.sh "$GITHUB_WORKSPACE/out/occt-android"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/out/full-gui/host-icu73/lib" >> "$GITHUB_ENV"

      - name: Download completed binding bundle from the selected run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.bindings.outputs.run }}
          github-token: ${{ github.token }}
          name: android-python-bindings-arm64
          path: out/bindings
      - name: Preflight binding ABI and transitive libraries then integrate into native payload
        run: |
          set -euo pipefail
          sha256sum -c out/bindings/android-python-bindings-arm64.sha256
          mkdir -p out/bindings/runtime
          tar xzf out/bindings/android-python-bindings-arm64.tar.gz -C out/bindings/runtime
          python3 full-gui/integrated-apk/integrate-bindings.py
          cp -a full-gui/upstream/python-compat out/upstream-freecad-gui/
          python3 full-gui/upstream/verify-native-python-bindings.py out/upstream-freecad-gui --strict

      - name: Verify binding integration preserved exact GLES Coin
        run: |
          set -euo pipefail
          native=out/upstream-freecad-gui/native
          test -s "$native/libCoin.so"
          readelf --dyn-syms --wide "$native/libCoin.so" |
            awk '$7 != "UND" && $8 ~ /^drnas_coin_android_gles_guard_v2(@.*)?$/ { found=1 } END { exit !found }'
          grep -aFq 'COIN_GLES_GUARD_V2' "$native/libCoin.so"
          ( cd "$native" && sha256sum -c SHA256SUMS )
          echo "COIN_AFTER_BINDINGS_SHA256=$(sha256sum "$native/libCoin.so" | cut -d' ' -f1) guard=v2 PASS"

      # The native GUI artifact may predate the Qt default-FBO bridge.
      # Apply AFTER integrate-bindings.py, which includes its older GL pair.
      # Rebuild only GL4ES/GLU from current integration sources, retaining
      # the verified FreeCAD/Coin binaries and all dependency caches.
      - name: Remove artifact OpenGL payload before restoring current bridge
        run: rm -rf out/upstream-freecad-gui/opengl-compat
      - name: Restore GL4ES with Qt default framebuffer bridge
        id: qt_fbo_gl
        uses: actions/cache/restore@v4
        with:
          path: out/upstream-freecad-gui/opengl-compat
          key: freecadgui-gl4es-glu-arm64-a025615-2fed2bd-v1-${{ hashFiles('full-gui/upstream/build-android-gl4es-glu.sh', 'full-gui/upstream/patch-qt-gl-state.py') }}
      - name: Build and require exported Qt framebuffer bridge
        run: |
          set -euo pipefail
          gl=out/upstream-freecad-gui/opengl-compat/lib/libGL.so
          if ! readelf --dyn-syms --wide "$gl" 2>/dev/null | awk '$7 != "UND" && $8 == "drnas_gl4es_qt_raster_state_v3" { found=1 } END { exit !found }'; then
            bash full-gui/upstream/build-android-gl4es-glu.sh
          fi
          readelf --dyn-syms --wide "$gl" | awk '$7 != "UND" && $8 == "drnas_gl4es_qt_raster_state_v3" { found=1 } END { exit !found }'
          for name in GL GLU; do
            readelf -h "out/upstream-freecad-gui/opengl-compat/lib/lib${name}.so" | grep -q AArch64
          done
          echo 'PASS: current Android GL4ES exports Qt default framebuffer bridge'
      - name: Cache verified GL4ES Qt framebuffer bridge
        if: steps.qt_fbo_gl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/upstream-freecad-gui/opengl-compat
          key: freecadgui-gl4es-glu-arm64-a025615-2fed2bd-v1-${{ hashFiles('full-gui/upstream/build-android-gl4es-glu.sh', 'full-gui/upstream/patch-qt-gl-state.py') }}

      - name: Resolve successful NumPy wheel workflow run
        id: numpy
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NUMPY_RUN: ${{ inputs.numpy_run_id }}
        run: |
          set -euo pipefail
          run="${INPUT_NUMPY_RUN:-40081766053}"
          if [ -z "$run" ]; then
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/numpy-android-arm64.yml/runs?branch=feature/full-freecad-android&status=success&per_page=10" --jq '.workflow_runs[0].id')"
          fi
          test "$run" != null && [[ "$run" =~ ^[0-9]+$ ]]
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
          test "$(jq -r .conclusion <<< "$info")" = success
          test "$(jq -r .head_branch <<< "$info")" = feature/full-freecad-android
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Download verified NumPy CPython 3.14 Android ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.numpy.outputs.run }}
          github-token: ${{ github.token }}
          name: drnas-numpy-cp314-android-arm64
          path: out/numpy-wheel
      - name: Stage NumPy wheel for APK packaging and verify native ABI
        run: |
          set -euo pipefail
          mkdir -p out/integrated-freecad-qtapk
          python3 full-gui/integrated-apk/stage-numpy-wheel.py out/numpy-wheel out/integrated-freecad-qtapk/numpy-stage
      - name: Stage native FreeCADGui and all verified Android dependencies
        env:
          UPSTREAM_GUI_RUN_ID: ${{ steps.upstream.outputs.run_id }}
        run: bash full-gui/integrated-apk/stage-runtime.sh

      - name: Stage pinned BIM and Draft restore modules and original Qt resources
        run: |
          python3 full-gui/integrated-apk/stage-bim-resources.py \
            .deps/freecad-runtime-resources out/upstream-freecad-gui/resources \
            "$GITHUB_WORKSPACE/out/full-deps/qt/$QT_VERSION/gcc_64/libexec/rcc"
          python3 -m unittest discover -s tests -p 'test_android_*.py' -v

      - name: Configure Android QtActivity and real FreeCAD native GUI integration
        run: |
          set -euo pipefail
          qt="$GITHUB_WORKSPACE/out/full-deps/qt/$QT_VERSION/android_arm64_v8a"
          host="$GITHUB_WORKSPACE/out/full-deps/qt/$QT_VERSION/gcc_64"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          cmake -S full-gui/qt-activity -B .build/freecad-native-integration -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_FIND_ROOT_PATH="$qt" \
            -DQT_HOST_PATH="$host" -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DOCCT_ANDROID_ROOT="$GITHUB_WORKSPACE/out/occt-android" \
            -DDRNAS_FREECAD_RUNTIME_DIR="$GITHUB_WORKSPACE/.build/freecad-integration-staging/native-libs" \
            2>&1 | tee out/integrated-freecad-qtapk/configure.log

      - name: Build signed installable QtActivity ARM64 APK with real FreeCADGui
        run: |
          set -euo pipefail
          cmake --build .build/freecad-native-integration \
            --target drnas_freecad_qtgui_make_apk --parallel 4 \
            2>&1 | tee out/integrated-freecad-qtapk/compile.log

      - name: Install ZIP packer for deferred native runtime
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zip
          fi

      - name: Repack FreeCADGui as deferred native libraries and re-sign Safe Mode APK
        run: bash full-gui/integrated-apk/package-safe-mode.sh

      - name: Verify actual APK ABI, signatures and native GUI library presence
        run: |
          set -euo pipefail
          apk="out/integrated-freecad-qtapk/DRNAS-FreeCAD-GuiNative-QtActivity-ARM64-SafeMode-debug.apk"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | tee out/integrated-freecad-qtapk/badging.txt
          grep -F "package: name='org.drnas.freecad.integrated'" out/integrated-freecad-qtapk/badging.txt
          unzip -Z1 "$apk" > out/integrated-freecad-qtapk/apk-files.txt
          # The C++ JNI bridge must resolve its Java peer at runtime.
          python3 - "$apk" <<'PY_ANDROID_SAF_DEX'
          from pathlib import Path
          import sys
          from zipfile import ZipFile
          with ZipFile(Path(sys.argv[1])) as package:
              dexes = [name for name in package.namelist()
                       if name.startswith("classes") and name.endswith(".dex")]
              assert dexes, "Android APK contains no DEX bytecode"
              for clazz in ("AndroidDocumentBridge", "DocumentPickerActivity"):
                  signature = ("Lorg/drnas/freecad/bootstrap/" + clazz + ";").encode()
                  assert any(signature in package.read(name) for name in dexes), (
                      f"{clazz} missing from packaged DEX"
                  )
          print("PASS: APK contains Java SAF document import bridge")
          PY_ANDROID_SAF_DEX
          grep -Fx 'lib/arm64-v8a/libFreeCADGui.so' out/integrated-freecad-qtapk/apk-files.txt
          for module in Measure MeasureGui; do
            grep -Fx "lib/arm64-v8a/$module.so" out/integrated-freecad-qtapk/apk-files.txt
            grep -Fx "assets/drnas/freecad/lib/$module.so" out/integrated-freecad-qtapk/apk-files.txt
          done
          grep -Fx 'assets/drnas/freecad/Mod/Measure/InitGui.py' out/integrated-freecad-qtapk/apk-files.txt
          for required in FreeCADBase FreeCADApp Coin GL GLU TKBO TKBRep; do
            grep -Fx "lib/arm64-v8a/lib${required}.so" out/integrated-freecad-qtapk/apk-files.txt
          done
          unzip -p "$apk" lib/arm64-v8a/libGL.so > out/integrated-freecad-qtapk/apk-libGL.so
          readelf --dyn-syms --wide out/integrated-freecad-qtapk/apk-libGL.so \
            | awk '$7 != "UND" && $8 == "drnas_gl4es_qt_raster_state_v3" { found=1 } END { exit !found }'
          rm out/integrated-freecad-qtapk/apk-libGL.so
          # Verify signed APK's Coin DSO, rather than trusting upstream build status.
          unzip -p "$apk" lib/arm64-v8a/libCoin.so > out/integrated-freecad-qtapk/apk-libCoin.so
          coin_so=out/integrated-freecad-qtapk/apk-libCoin.so
          # Verify final APK contains the SAME staged Coin DSO, not an
          # androiddeployqt leftover or another revision with the same name.
          staged_coin=".build/freecad-integration-staging/native-libs/libCoin.so"
          test -s "$staged_coin"
          sha256sum "$staged_coin" "$coin_so"
          if ! cmp -s "$staged_coin" "$coin_so"; then
            echo "::error::Signed APK libCoin.so differs from staged native runtime"
            exit 1
          fi
          # ELF symbol names may have GNU symbol-version suffixes (@ or @@).
          # Preserve the strict defined DSO symbol check; print diagnostics
          # before rejecting an absent marker instead of silently exiting 1.
          if readelf --dyn-syms --wide "$coin_so" \
            | awk '$7 != "UND" && $8 ~ /^drnas_coin_android_gles_guard_v2(@.*)?$/ { found=1; print "COIN_GLES_EXPORT: " $0 } END { exit !found }'; then
            echo 'PASS: final signed APK exports Coin GLES guard v2'
          else
            echo 'ERROR: signed APK Coin DSO does not export guard v2 marker'
            echo 'Coin symbols present in full symbol table:'
            readelf --syms --wide "$coin_so" | grep -F 'drnas_coin_android_gles_guard_v2' || true
            echo 'Coin string marker in packaged DSO:'
            strings "$coin_so" | grep -F 'COIN_GLES_GUARD_V2' || true
            echo 'Coin ELF build ID:'
            readelf -n "$coin_so" | grep -A3 'Build ID' || true
            exit 1
          fi
          rm "$coin_so"
          # SHA recorded immediately after ELF relocation must survive all
          # Android/CMake/Gradle/ZIP/signing stages unchanged.
          ( cd .build/freecad-integration-staging/native-libs &&
              sha256sum -c "$GITHUB_WORKSPACE/out/integrated-freecad-qtapk/Coin-GLES-Staged.sha256" )
          # Verify transitive dependencies for EVERY arm64 library, not only
          # FreeCADGui/Base/App. Prior signed APK crashed instantly because
          # Qt6PrintSupport, Qt6Network and Qt6Xml were not packaged.
          python3 full-gui/integrated-apk/verify-apk-native-dependencies.py "$apk" \
            2>&1 | tee out/integrated-freecad-qtapk/native-dt-needed-audit.txt
          python3 full-gui/upstream/audit-python-bindings.py "$apk" --require-all
          (cd out/integrated-freecad-qtapk && sha256sum *.apk > APK-SHA256SUMS.txt)
          echo 'PASS: Signed SAFE MODE ARM64 APK bundles FreeCADGui and Coin3D without eager QtLoader loading.'
          echo 'NOTICE: Runtime and FreeCAD desktop MainWindow have not yet been tested on a physical phone.'

      - name: Upload APK and diagnostics even if integration fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-FreeCADGui-Real-Native-APK-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/integrated-freecad-qtapk/
          retention-days: 30
          if-no-files-found: warn
