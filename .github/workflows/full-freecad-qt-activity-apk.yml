name: DRNAS FreeCAD QtActivity GUI LAB APK - Android arm64
# This is a standalone OCCT GUI smoke LAB, not the real full FreeCAD APK.
# Keep it manually callable, but don't rebuild a second app on every change
# to IntegratedGui.cpp. The real integrated GUI packaging workflow already
# uses the verified upstream native FreeCAD artifact.
on:
  workflow_dispatch:

permissions:
  contents: read
env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '27.2.12479018'
  ANDROID_API: '26'
concurrency:
  group: drnas-qt-activity-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qt-activity:
    name: Compile and package real QtActivity + Qt6 QMainWindow GUI LAB
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Qt Android APK prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build file binutils unzip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' "ndk;$NDK_VERSION"
          mkdir -p out/full-gui/qt-activity
      # Qt 6.8.3 official host androiddeployqt needs ICU 73; Ubuntu 24.04
      # has ICU 74, which must NOT be symlinked as a substitute.
      - name: Restore real ICU 73 host runtime for Qt Android tools
        id: host_icu
        uses: actions/cache/restore@v4
        with:
          path: out/full-gui/host-icu73
          key: drnas-qt-host-icu73-v1-${{ hashFiles('full-gui/bootstrap-icu73-host.sh') }}
      - name: Compile ICU 73 x86_64 for official Qt tools, only once
        if: steps.host_icu.outputs.cache-hit != 'true'
        run: bash full-gui/bootstrap-icu73-host.sh
      - name: Cache verified Qt host ICU 73 runtime
        if: steps.host_icu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/full-gui/host-icu73
          key: drnas-qt-host-icu73-v1-${{ hashFiles('full-gui/bootstrap-icu73-host.sh') }}
      - name: Use host ICU73 for androiddeployqt, never Android JNI
        run: |
          set -euo pipefail
          test -f out/full-gui/host-icu73/lib/libicui18n.so.73
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/out/full-gui/host-icu73/lib" >> "$GITHUB_ENV"
      - name: Restore GUI Qt6 Android SDK (including QtSvg)
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: out/full-deps/qt
          key: drnas-qt-gui-6.8.3-arm64-v1-${{ hashFiles('full-gui/bootstrap-qt-gui-android.sh', 'full-port/bootstrap-qt.sh', 'full-port/verify-qt-android.sh') }}
      - name: Require Android Qt6 GUI cache; never use host GUI .so
        run: |
          test "${{ steps.qt.outputs.cache-hit }}" = true
          test -f out/full-deps/qt/$QT_VERSION/android_arm64_v8a/lib/cmake/Qt6SvgWidgets/Qt6SvgWidgetsConfig.cmake
          test -f out/full-deps/qt/$QT_VERSION/gcc_64/bin/qmake6
      - name: Restore verified native OpenCASCADE 7.9.3 ARM64 library SDK
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: out/occt-android
          key: occt-install-android-arm64-V7_9_3-ndk27.2-api26-v1-${{ hashFiles('scripts/build-occt-android.sh', 'scripts/verify-android-elf.sh') }}
      - name: Require cached native Android OCCT B-Rep, no recompilation
        run: |
          set -euo pipefail
          test "${{ steps.occt.outputs.cache-hit }}" = true
          test -f out/occt-android/lib/libTKBO.so
          test -f out/occt-android/include/opencascade/TopoDS_Shape.hxx
          bash scripts/verify-android-elf.sh "$GITHUB_WORKSPACE/out/occt-android"
      - name: Configure official Qt Android QtActivity app with CMake
        run: |
          set -euo pipefail
          qt="$GITHUB_WORKSPACE/out/full-deps/qt/$QT_VERSION/android_arm64_v8a"
          host="$GITHUB_WORKSPACE/out/full-deps/qt/$QT_VERSION/gcc_64"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          cmake -S full-gui/qt-activity -B .build/freecad-qt-activity -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_FIND_ROOT_PATH="$qt" \
            -DQT_HOST_PATH="$host" -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DOCCT_ANDROID_ROOT="$GITHUB_WORKSPACE/out/occt-android" \
            2>&1 | tee out/full-gui/qt-activity/cmake-configure.log
      - name: Build standalone Qt Widgets/OpenGLWidgets APK with androiddeployqt
        id: build
        run: |
          set -euo pipefail
          cmake --build .build/freecad-qt-activity \
            --target drnas_freecad_qtgui_make_apk --parallel 4 \
            2>&1 | tee out/full-gui/qt-activity/androiddeployqt-build.log
      - name: Validate ARM64 QtActivity APK signing and package name
        run: |
          set -euo pipefail
          apk="$(find .build/freecad-qt-activity -name '*.apk' -type f -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee out/full-gui/qt-activity/badging.txt
          grep -F "org.drnas.freecad.qtgui" out/full-gui/qt-activity/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "arm64-v8a"
          for so in libTKBO.so libTKBRep.so libTKPrim.so; do
            unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/$so" || {
              echo "::error::Missing native OCCT geometry DLL inside Qt GUI APK: $so"
              exit 1
            }
          done
          echo 'Native Qt + REAL OpenCASCADE 3D B-Rep viewport included in APK.'
          cp "$apk" out/full-gui/qt-activity/DRNAS-FreeCAD-QtActivity-Native-OCCT-Viewport-ARM64-debug.apk
          (cd out/full-gui/qt-activity && sha256sum *.apk > APK-SHA256SUMS.txt)
          echo "PASS: QtActivity + native Qt6 GUI lab APK packaged; device execution not yet tested."
      - name: Preserve APK, Gradle build outputs and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-FreeCAD-QtActivity-GUI-LAB-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/full-gui/qt-activity/
          retention-days: 30
          if-no-files-found: warn
